<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>bake env</title>
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "three/addons/": "/node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <script type="module">
      import * as THREE from "three";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

      // RoomEnvironment's linear radiance (its softboxes reach 50), not the 8-bit sRGB the old jpeg clipped to 1.
      const W = 1024;
      const H = 512;
      const renderer = new THREE.WebGLRenderer({ antialias: false });
      renderer.setSize(W, H);
      renderer.toneMapping = THREE.NoToneMapping;

      const scene = new RoomEnvironment();
      const cubeRT = new THREE.WebGLCubeRenderTarget(256, { type: THREE.HalfFloatType });
      const cubeCam = new THREE.CubeCamera(0.1, 60, cubeRT);
      cubeCam.update(renderer, scene);

      const eqScene = new THREE.Scene();
      const eqCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const mat = new THREE.ShaderMaterial({
        uniforms: { tCube: { value: cubeRT.texture } },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = vec4(position.xy, 0.0, 1.0);
          }`,
        fragmentShader: `
          uniform samplerCube tCube;
          varying vec2 vUv;
          void main() {
            float theta = vUv.x * 6.28318530718;
            float phi = (1.0 - vUv.y) * 3.14159265359;
            vec3 dir = vec3(sin(phi) * sin(theta), cos(phi), sin(phi) * cos(theta));
            gl_FragColor = textureCube(tCube, dir);
          }`,
      });
      eqScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));
      const eqRT = new THREE.WebGLRenderTarget(W, H, { type: THREE.FloatType, depthBuffer: false });
      renderer.setRenderTarget(eqRT);
      renderer.render(eqScene, eqCam);
      const rgba = new Float32Array(W * H * 4);
      await renderer.readRenderTargetPixelsAsync(eqRT, 0, 0, W, H, rgba);
      // Rows top to bottom, RGB only. The old canvas jpeg's top row was v = 1, the render target's last row.
      const rgb = new Float32Array(W * H * 3);
      for (let y = 0; y < H; y++) {
        const src = (H - 1 - y) * W * 4;
        for (let x = 0; x < W; x++) {
          rgb[(y * W + x) * 3] = rgba[src + x * 4];
          rgb[(y * W + x) * 3 + 1] = rgba[src + x * 4 + 1];
          rgb[(y * W + x) * 3 + 2] = rgba[src + x * 4 + 2];
        }
      }
      const bytes = new Uint8Array(rgb.buffer);
      let bin = "";
      for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
      window.__baked = { w: W, h: H, b64: btoa(bin) };
    </script>
  </body>
</html>
