# nginx route for the self-hosted app. Template: replace @BASE@ (APP_BASE, with
# both slashes, e.g. /game/), @PORT@ (PORT in the env file) and @ACCESS_LOG@
# (see below), then `include` this file inside the existing
# `server { listen 443 ... }` block of the site.
#
# proxy_pass has no URI part, so the request path (base included) reaches the
# node server unchanged; the app was built with the same base.
# Signaling is plain HTTP polling, so no WebSocket upgrade is needed.
#
# Every location here logs to @ACCESS_LOG@ instead of the site's access log.
# Pick a file outside the logpath of every fail2ban jail that bans on 4xx (a
# "probe"/"botsearch" jail): an ordinary game 404 or 405 must never ban a
# player. Mind globs: Debian's default nginx_access_log is
# /var/log/nginx/*access.log, so a name ending in "access.log" would still be
# watched. The error log stays shared.

# Without this, `@BASE@` minus its trailing slash would fall through to the
# site's `location /` and 404.
location = @NOSLASH@ {
	access_log @ACCESS_LOG@;
	return 301 @BASE@;
}

location ^~ @BASE@ {
	access_log @ACCESS_LOG@;
	proxy_pass http://127.0.0.1:@PORT@;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	# Overwrite, never append: the app may rate-limit by the first hop, so a
	# client-supplied X-Forwarded-For must not survive.
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-Host $host;
	# Signaling bodies are SDP/ICE (the app caps them at 32 KB).
	client_max_body_size 64k;
	proxy_read_timeout 30s;
	# The site's `gzip on` keeps the default gzip_types (HTML only), so JS/CSS
	# went out raw: 1.19 MB of initial JS, plus 2.18 MB for the lazy physics chunk.
	# text/plain: the app serves the RGBE studio env (env-studio.hdr, 711 kB, 138 kB gzipped) as text/plain.
	gzip_types text/css text/plain application/javascript text/javascript application/json application/wasm image/svg+xml;
	gzip_vary on;
}

# Platform chrome (PWA manifest, touch icon, iOS install page, share cards)
# keeps root-relative URLs by design, so these root paths go to the app too.
# Check first that the site root does not already use them.
# The manifest is generated by the app's middleware at the root path itself:
location = /__grok/manifest.webmanifest {
	access_log @ACCESS_LOG@;
	proxy_pass http://127.0.0.1:@PORT@;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-Host $host;
}
location = /__grok/manifest.json {
	access_log @ACCESS_LOG@;
	proxy_pass http://127.0.0.1:@PORT@;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-Host $host;
}
# Everything else is a public file the app serves under @BASE@ (without the
# mapping the app would answer with a redirect into @BASE@).
location ^~ /__grok/ {
	access_log @ACCESS_LOG@;
	proxy_pass http://127.0.0.1:@PORT@@BASE@__grok/;
}
location = /og.jpg {
	access_log @ACCESS_LOG@;
	proxy_pass http://127.0.0.1:@PORT@@BASE@og.jpg;
}
location = /x-banner.jpg {
	access_log @ACCESS_LOG@;
	proxy_pass http://127.0.0.1:@PORT@@BASE@x-banner.jpg;
}
