# nginx route for the self-hosted app. Template: replace @BASE@ (APP_BASE, with
# both slashes, e.g. /game/) and @PORT@ (PORT in the env file), then `include`
# this file inside the existing `server { listen 443 ... }` block of the site.
#
# proxy_pass has no URI part, so the request path (base included) reaches the
# node server unchanged; the app was built with the same base.
# Signaling is plain HTTP polling, so no WebSocket upgrade is needed.

# Without this, `@BASE@` minus its trailing slash would fall through to the
# site's `location /` and 404.
location = @NOSLASH@ {
	return 301 @BASE@;
}

location ^~ @BASE@ {
	proxy_pass http://127.0.0.1:@PORT@;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	# Overwrite, never append: the app may rate-limit by the first hop, so a
	# client-supplied X-Forwarded-For must not survive.
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-Host $host;
	# Signaling bodies are SDP/ICE (the app caps them at 32 KB).
	client_max_body_size 64k;
	proxy_read_timeout 30s;
}
